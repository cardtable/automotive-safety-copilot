# Corpus manifest. Every document here is fetched from its official publisher.
#
# FMVSS: 49 CFR Part 571 via the eCFR versioner API (XML, one file per standard).
# UN/ECE: 1958 Agreement regulations via the UN Official Document System
#   (symbol E/ECE/TRANS/505/Rev.N/Add.M[/Rev.K]); the downloader resolves the
#   newest consolidated revision ("/Rev.K") automatically.
# Euro NCAP: 2026 test & assessment protocols from cdn.euroncap.com.

fmvss:
  ecfr_date: latest          # or an ISO date, e.g. 2026-10-01
  sections:                  # 49 CFR 571.<n>
    - "101"   # Controls and displays
    - "108"   # Lamps, reflective devices
    - "111"   # Rear visibility
    - "126"   # Electronic stability control
    - "127"   # Automatic emergency braking
    - "135"   # Light vehicle brake systems
    - "138"   # Tire pressure monitoring
    - "201"   # Occupant protection in interior impact
    - "202a"  # Head restraints
    - "203"   # Impact protection from steering control
    - "205"   # Glazing materials
    - "207"   # Seating systems
    - "208"   # Occupant crash protection
    - "209"   # Seat belt assemblies
    - "210"   # Seat belt assembly anchorages
    - "213"   # Child restraint systems
    - "214"   # Side impact protection
    - "216a"  # Roof crush resistance
    - "225"   # Child restraint anchorage systems
    - "226"   # Ejection mitigation
    - "301"   # Fuel system integrity
    - "305a"  # Electric-powered vehicles: electrolyte spillage and shock protection

unece:
  # reg: UN Regulation number; series: 505 revision series holding the addendum
  - {reg: 14,  series: 1, title: "Safety-belt anchorages"}
  - {reg: 16,  series: 1, title: "Safety-belts and restraint systems"}
  - {reg: 17,  series: 1, title: "Strength of seats and their anchorages, head restraints"}
  - {reg: 48,  series: 1, title: "Installation of lighting and light-signalling devices"}
  - {reg: 79,  series: 1, title: "Steering equipment"}
  - {reg: 94,  series: 1, title: "Frontal collision (offset)"}
  - {reg: 95,  series: 1, title: "Lateral collision"}
  - {reg: 100, series: 2, title: "Electric power train vehicles"}
  - {reg: 127, series: 2, title: "Pedestrian safety"}
  - {reg: 129, series: 2, title: "Enhanced Child Restraint Systems"}
  - {reg: 135, series: 2, title: "Pole Side Impact"}
  - {reg: 137, series: 2, title: "Frontal impact (full width)"}
  - {reg: 152, series: 3, title: "Advanced Emergency Braking System (AEBS) for M1 and N1"}
  - {reg: 157, series: 3, title: "Automated Lane Keeping Systems (ALKS)"}

